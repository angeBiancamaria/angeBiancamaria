<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#2d1a35"/><stop offset="1" stop-color="#2d1a35"/>
  </linearGradient>
  <filter id="soft"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".35"/></filter>
</defs>

<rect width="900" height="360" rx="22" fill="url(#bg)" stroke="#ff86cf" stroke-width="2"/>

<text x="40" y="52" fill="#f8fafc" font-family="Arial,sans-serif"
      font-size="30" font-weight="700">My Goals</text>
<path d="M184 43H850" stroke="#ff86cf" stroke-width="2" opacity=".6"/>
<path d="M850 43l9 9 9-9-9-9z" fill="#ffd17d"/>

<!-- GOAL 01 -->
<g transform="translate(28 95)">
  <!-- target -->
  <circle cx="105" cy="105" r="72" fill="none" stroke="#ff86cf" stroke-width="2" opacity=".35"/>
  <circle cx="105" cy="105" r="62" fill="#2d1a35" stroke="#ff86cf" stroke-width="4"/>
  <circle cx="105" cy="105" r="45" fill="#2d1a35" stroke="#f8fafc" stroke-width="5"/>
  <circle cx="105" cy="105" r="29" fill="#dbeafe" stroke="#ff86cf" stroke-width="5"/>
  <circle cx="105" cy="105" r="14" fill="#ff86cf"/>
  <circle cx="105" cy="105" r="5" fill="#fff"/>
  <g transform="rotate(-42 105 105)" filter="url(#soft)">
    <path d="M105 30V105" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M105 25l-10 16h20z" fill="#fff"/>
  </g>

  <!-- content -->
  <rect x="195" y="22" width="150" height="34" rx="17"
        fill="#111c35" stroke="#ff86cf" stroke-width="2"/>
  <text x="270" y="45" text-anchor="middle" fill="#ffd17d"
        font-family="Arial,sans-serif" font-size="14" font-weight="700"
        letter-spacing="1.5">GOAL 01</text>
  <text x="195" y="93" fill="#f8fafc" font-family="Arial,sans-serif"
        font-size="24" font-weight="700">Internship</text>
  <text x="195" y="123" fill="#94a3b8" font-family="Arial,sans-serif"
        font-size="15">Gain professional experience</text>
  <text x="195" y="146" fill="#94a3b8" font-family="Arial,sans-serif"
        font-size="15">in a real working environment.</text>
</g>

<!-- arrow between goals -->
<g transform="translate(438 200)">
  <path d="M0 0H24" stroke="#64748b" stroke-width="3"/>
  <path d="M17 -7L27 0 17 7" fill="none" stroke="#c4b5fd" stroke-width="3"/>
</g>

