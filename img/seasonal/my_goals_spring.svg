<path d="M850 43l9 9 9-9-9-9z" fill="#ffc4dc"/>

<!-- GOAL 01 -->
<g transform="translate(28 95)">
  <!-- target -->
  <circle cx="105" cy="105" r="72" fill="none" stroke="#a7e4a2" stroke-width="2" opacity=".35"/>
  <circle cx="105" cy="105" r="62" fill="#142b2b" stroke="#a7e4a2" stroke-width="4"/>
