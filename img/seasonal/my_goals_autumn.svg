<path d="M184 43H850" stroke="#f3a866" stroke-width="2" opacity=".6"/>
<path d="M850 43l9 9 9-9-9-9z" fill="#e6ba6b"/>

<!-- GOAL 01 -->
<g transform="translate(28 95)">
  <!-- target -->
  <circle cx="105" cy="105" r="72" fill="none" stroke="#f3a866" stroke-width="2" opacity=".35"/>
  <circle cx="105" cy="105" r="62" fill="#2a1d21" stroke="#f3a866" stroke-width="4"/>
