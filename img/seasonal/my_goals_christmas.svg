  <g transform="rotate(-42 105 105)" filter="url(#soft)">
    <path d="M105 30V105" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M105 25l-10 16h20z" fill="#fff"/>
  </g>

