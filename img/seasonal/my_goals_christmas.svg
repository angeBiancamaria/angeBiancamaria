  <text x="195" y="123" fill="#94a3b8" font-family="Arial,sans-serif"
        font-size="15">Gain professional experience</text>
  <text x="195" y="146" fill="#94a3b8" font-family="Arial,sans-serif"
        font-size="15">in a real working environment.</text>
</g>

