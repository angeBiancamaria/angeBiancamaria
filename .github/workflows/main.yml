name: Daily Quote Update

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC chaque jour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate quote
        run: |
          FILE="stats/quotes_history.txt"
          STATS_FILE="stats/quotes_stats.txt"
          DELAY_FILE="stats/delay_log.txt"

          touch "$FILE"
          touch "$STATS_FILE"
          touch "$DELAY_FILE"

          QUOTES=(
            "I don’t always test my code… but when I do, I do it in production."
            "There are 10 types of people in the world: those who understand binary and those who don’t."
            "It works on my machine."
            "First, solve the problem. Then, write the code."
            "I’m not lazy, I’m just in energy-saving mode."
            "Debugging: being the detective in a crime movie where you are also the murderer."
            "Computers are fast; developers keep it interesting."
            "Weeks of coding can save you hours of planning."
            "I would love to change the world, but they won’t give me the source code."
            "If it compiles, ship it."
            "Turning coffee into scalable solutions since the first compile."
            "It works on my machine — now let's make it work everywhere."
            "Writing code today that future me will pretend not to recognize."
            "Professional bug creator and part-time bug remover."
            "Making computers do things they were never explicitly asked to do."
            "Clean code is temporary. Deadlines are forever."
            "Debugging: because the code refuses to explain itself."
            "Building features nobody knew they needed until yesterday."
            "One commit at a time, one questionable decision at a time."
            "Turning business requirements into surprisingly specific error messages."
            "Keeping production alive with code and positive thinking."
            "I don't always write bugs, but when I do, they're in production."
            "Making software look easy since discovering Stack Overflow."
            "Refactoring yesterday's genius into today's technical debt."
            "Code, test, deploy, question every life choice."
            "Solving problems that would not exist without software."
            "My favorite programming language is whatever pays the bills."
            "Writing elegant solutions to problems created by previous elegant solutions."
            "Turning ‘just one small change’ into a three-day adventure."
            "Deploying confidence, debugging reality."
            "Professional problem solver, occasional problem generator."
            "Making APIs talk to each other so humans don't have to."
            "Some call it technical debt. I call it future employment."
            "If it compiles, it's a promising start."
            "Building the future, one error message at a time."
            "My code has fewer bugs than my sleep schedule."
            "Turning caffeine, documentation, and questionable ideas into software."
            "Because apparently, computers need instructions for everything."
            "Writing code that future developers will definitely understand. Probably."
            "Keeping the semicolons aligned and the deadlines slightly less so."
            "Debugging is just detective work with worse lighting."
            "I came for the code and stayed for the production incidents."
            "Making complex problems slightly more complicated before simplifying them."
            "Turning requirements into features and features into maintenance tasks."
            "Code first, documentation when the guilt becomes unbearable."
            "Building systems robust enough to survive their users."
            "One does not simply deploy without checking the logs."
            "Creating solutions, fixing problems, and occasionally creating new ones."
            "My code doesn't judge you. The linter does."
            "Writing software with confidence, deploying it with caution."
            "The fastest way to find a bug is to announce that everything works."
            "Making machines productive while questioning my own productivity."
            "Turning vague requirements into very precise technical problems."
            "A good developer knows the answer. A great developer knows where to look."
            "Keeping production stable through skill, testing, and suspicious amounts of luck."
            "Every bug is just an undocumented feature waiting for attention."
            "Building tomorrow's legacy code today."
            "Professional software engineer, amateur fortune teller for production issues."
            "The code is clean. The Git history is classified."
            "Deploying software is easy. Explaining why it broke is the real feature."
            "Delivering reliable software and carefully managed technical surprises."
            "Optimizing performance, maintainability, and the occasional existential crisis."
            "Engineering solutions with measurable results and immeasurable debugging sessions."
            "Transforming business logic into maintainable code and manageable chaos."
            "Committed to clean code, reliable systems, and reasonably timed coffee breaks."
            "Improving systems one pull request and one review comment at a time."
            "Building software that works, scales, and occasionally behaves as documented."
            "Turning complex requirements into simple interfaces and complicated Git histories."
            "Focused on delivering quality software, preferably before production finds the bugs."
            "Software development: where ‘almost finished’ is a perfectly valid status."
            )

          UNUSED=()

          for Q in "${QUOTES[@]}"; do
            if ! grep -Fq "| $Q" $FILE; then
              UNUSED+=("$Q")
            fi
          done

          if [ ${#UNUSED[@]} -eq 0 ]; then
            UNUSED=("${QUOTES[@]}")
          fi

          QUOTE=${UNUSED[$RANDOM % ${#UNUSED[@]}]}

          # Date + heure FR
          DATE=$(TZ="Europe/Paris" date "+%Y-%m-%d %H:%M")

          # -------- DELAY GITHUB ACTIONS --------
          # Le workflow est planifié à 06:00 UTC. On mesure le retard réel
          # par rapport à cette heure, sans dépendre du changement d'heure français.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            EXPECTED_TS=$(date -u -d "$(date -u +%F) 06:00:00" +%s)
            NOW_TS=$(date -u +%s)
            DELAY=$(( (NOW_TS - EXPECTED_TS) / 60 ))
            [ "$DELAY" -lt 0 ] && DELAY=0
            echo "$DATE | Delay: ${DELAY} min" >> "$DELAY_FILE"
          fi

          # -------- HISTORY --------
          echo "$DATE | $QUOTE" >> $FILE
          echo "$QUOTE" > stats/quote.txt

          # -------- STATS --------
          cut -d '|' -f2 "$FILE" | sed 's/^ //' > stats/temp_quotes.txt
          sort stats/temp_quotes.txt | uniq -c | sort -nr | awk '{count=$1; $1=""; sub(/^ /, ""); print $0 " | " count}' > "$STATS_FILE"
          rm stats/temp_quotes.txt

          # -------- TOP 3 QUOTES --------
          head -n 3 "$STATS_FILE" > stats/top_quotes.txt

          # Generate a polished SVG chart for the README.
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          rows = []
          for line in Path("stats/top_quotes.txt").read_text(encoding="utf-8").splitlines():
              if " | " in line:
                  quote, count = line.rsplit(" | ", 1)
                  try:
                      rows.append((quote, int(count)))
                  except ValueError:
                      pass

          W, H = 900, 470
          bg = "#0d1117"
          panel = "#161b22"
          border = "#30363d"
          text_color = "#f0f6fc"
          muted = "#8b949e"
          accents = ["#f2cc60", "#c9d1d9", "#d2995f"]

          def wrap(s, width=62):
              words = s.split()
              lines, current = [], ""
              for word in words:
                  candidate = (current + " " + word).strip()
                  if len(candidate) <= width:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              return lines[:2]

          max_count = max((count for _, count in rows), default=1)
          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              f'<rect width="{W}" height="{H}" rx="18" fill="{bg}"/>',
              f'<rect x="1" y="1" width="{W-2}" height="{H-2}" rx="18" fill="none" stroke="{border}"/>',
              f'<text x="42" y="52" fill="{text_color}" font-family="Arial, sans-serif" font-size="25" font-weight="700">🏆 Top 3 Daily Quotes</text>',
              f'<text x="42" y="78" fill="{muted}" font-family="Arial, sans-serif" font-size="14">The quotes that appeared most often in the daily rotation</text>',
          ]

          if not rows:
              parts.append(f'<text x="42" y="145" fill="{muted}" font-family="Arial, sans-serif" font-size="16">No quote statistics available yet.</text>')
          else:
              y = 112
              bar_x = 610
              bar_w = 225
              for i, (quote, count) in enumerate(rows):
                  accent = accents[i]
                  medal = ["1", "2", "3"][i]
                  parts.append(f'<rect x="36" y="{y}" width="828" height="100" rx="14" fill="{panel}" stroke="{border}"/>')
                  parts.append(f'<circle cx="72" cy="{y+50}" r="23" fill="{accent}"/>')
                  parts.append(f'<text x="72" y="{y+57}" text-anchor="middle" fill="#0d1117" font-family="Arial, sans-serif" font-size="17" font-weight="700">{medal}</text>')

                  qlines = wrap(quote)
                  for j, qline in enumerate(qlines):
                      parts.append(
                          f'<text x="112" y="{y+39+j*22}" fill="{text_color}" '
                          f'font-family="Arial, sans-serif" font-size="15" font-weight="600">{escape(qline)}</text>'
                      )

                  ratio = count / max_count if max_count else 0
                  width = max(8, int(bar_w * ratio))
                  parts.append(f'<rect x="{bar_x}" y="{y+36}" width="{bar_w}" height="10" rx="5" fill="#21262d"/>')
                  parts.append(f'<rect x="{bar_x}" y="{y+36}" width="{width}" height="10" rx="5" fill="{accent}"/>')
                  parts.append(
                      f'<text x="{bar_x}" y="{y+68}" fill="{muted}" font-family="Arial, sans-serif" '
                      f'font-size="13">{count} use(s)</text>'
                  )
                  y += 112

          parts.append(f'<text x="42" y="{H-18}" fill="{muted}" font-family="Arial, sans-serif" font-size="11">Updated automatically by GitHub Actions</text>')
          parts.append("</svg>")

          Path("img/top_quotes.svg").write_text("\n".join(parts), encoding="utf-8")
          PY

      - name: Update README
        run: |
          QUOTE=$(cat stats/quote.txt)
          sed -i "/📝 \*\*Daily thought\*\*/,/^$/ s|> .*|> $QUOTE|" README.md

          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          stats = Path("stats/top_quotes.txt")
          text = readme.read_text(encoding="utf-8")

          lines = []
          for i, line in enumerate(stats.read_text(encoding="utf-8").splitlines(), 1):
              if " | " in line:
                  quote, count = line.rsplit(" | ", 1)
                  lines.append(f"{i}. **{quote}** — {count} use(s)")

          start = "<!-- TOP_QUOTES_START -->"
          end = "<!-- TOP_QUOTES_END -->"
          section = "### 🏆 Top 3 Daily Quotes\n\n![Top 3 Daily Quotes](./img/top_quotes.svg)"
          block = f"{start}\n{section}\n{end}"

          if start in text and end in text:
              before = text.split(start, 1)[0]
              after = text.split(end, 1)[1]
              text = before + block + after
          else:
              text = text.rstrip() + "\n\n" + block + "\n"

          readme.write_text(text, encoding="utf-8")
          PY

      - name: Create monthly quote and delay report
        run: |
          # Génère une seule archive, le premier jour du mois, pour le mois précédent.
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Monthly report skipped: not the first day of the month."
            exit 0
          fi
          mkdir -p img/monthly

          python3 - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.sax.saxutils import escape
          import calendar

          now = datetime.now(timezone.utc)
          # Le rapport produit le 1er du mois couvre le mois civil précédent.
          year = now.year if now.month > 1 else now.year - 1
          month = now.month - 1 if now.month > 1 else 12
          month_key = f"{year:04d}-{month:02d}"
          month_label = f"{calendar.month_name[month]} {year}"

          history_path = Path("stats/quotes_history.txt")
          delay_path = Path("stats/delay_log.txt")
          history = history_path.read_text(encoding="utf-8").splitlines() if history_path.exists() else []
          delay_lines = delay_path.read_text(encoding="utf-8").splitlines() if delay_path.exists() else []

          monthly_quotes = []
          for line in history:
              if " | " not in line:
                  continue
              date_text, quote = line.split(" | ", 1)
              try:
                  date = datetime.strptime(date_text.strip(), "%Y-%m-%d %H:%M")
              except ValueError:
                  continue
              if date.strftime("%Y-%m") == month_key:
                  monthly_quotes.append((date, quote.strip()))

          counts = Counter(quote for _, quote in monthly_quotes)
          top_quotes = counts.most_common(3)
          days_recorded = len({date.date() for date, _ in monthly_quotes})
          unique_quotes = len(counts)
          total_quotes = len(monthly_quotes)

          delays = []
          for line in delay_lines:
              if " | " not in line or "Delay:" not in line:
                  continue
              date_text, detail = line.split(" | ", 1)
              try:
                  date = datetime.strptime(date_text.strip(), "%Y-%m-%d %H:%M")
                  delay_text = detail.split("Delay:", 1)[1].strip().split()[0]
                  delay = int(delay_text)
              except (ValueError, IndexError):
                  continue
              if date.strftime("%Y-%m") == month_key and delay >= 0:
                  delays.append((date, delay))

          top_delays = sorted(delays, key=lambda item: item[1], reverse=True)[:5]

          W, H = 1000, 850
          bg, panel, border = "#0d1117", "#161b22", "#30363d"
          white, muted = "#f0f6fc", "#8b949e"
          accents = ["#f2cc60", "#c9d1d9", "#d2995f"]
          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              f'<rect width="{W}" height="{H}" rx="20" fill="{bg}"/>',
              f'<rect x="1" y="1" width="{W-2}" height="{H-2}" rx="20" fill="none" stroke="{border}"/>',
              f'<text x="42" y="52" fill="{white}" font-family="Arial,sans-serif" font-size="29" font-weight="700">Monthly GitHub Quote Report</text>',
              f'<text x="42" y="82" fill="{muted}" font-family="Arial,sans-serif" font-size="17">{escape(month_label)} · Previous calendar month</text>',
          ]

          # Summary statistics
          stats = [
              ("Quotes published", str(total_quotes)),
              ("Different quotes", str(unique_quotes)),
              ("Days recorded", str(days_recorded)),
              ("Delays recorded", str(len(delays))),
          ]
          x_positions = [42, 280, 518, 756]
          for (label, value), x in zip(stats, x_positions):
              parts.extend([
                  f'<rect x="{x}" y="108" width="202" height="88" rx="13" fill="{panel}" stroke="{border}"/>',
                  f'<text x="{x+16}" y="143" fill="{muted}" font-family="Arial,sans-serif" font-size="14">{escape(label)}</text>',
                  f'<text x="{x+16}" y="177" fill="{white}" font-family="Arial,sans-serif" font-size="27" font-weight="700">{escape(value)}</text>',
              ])

          parts.append(f'<text x="42" y="245" fill="{white}" font-family="Arial,sans-serif" font-size="22" font-weight="700">Top 3 most-used random quotes</text>')
          if top_quotes:
              y = 265
              max_count = max(count for _, count in top_quotes) or 1
              for i, (quote, count) in enumerate(top_quotes):
                  accent = accents[i]
                  parts.append(f'<rect x="42" y="{y}" width="916" height="86" rx="12" fill="{panel}" stroke="{border}"/>')
                  parts.append(f'<circle cx="76" cy="{y+43}" r="21" fill="{accent}"/>')
                  parts.append(f'<text x="76" y="{y+49}" text-anchor="middle" fill="#0d1117" font-family="Arial,sans-serif" font-size="17" font-weight="700">{i+1}</text>')
                  quote_text = quote if len(quote) <= 95 else quote[:92] + "..."
                  parts.append(f'<text x="112" y="{y+35}" fill="{white}" font-family="Arial,sans-serif" font-size="16" font-weight="600">{escape(quote_text)}</text>')
                  bar_x, bar_y, bar_w = 112, y+55, 700
                  width = max(5, int(bar_w * count / max_count))
                  parts.append(f'<rect x="{bar_x}" y="{bar_y}" width="{bar_w}" height="8" rx="4" fill="#21262d"/>')
                  parts.append(f'<rect x="{bar_x}" y="{bar_y}" width="{width}" height="8" rx="4" fill="{accent}"/>')
                  parts.append(f'<text x="900" y="{y+60}" text-anchor="end" fill="{muted}" font-family="Arial,sans-serif" font-size="14">{count} use(s)</text>')
                  y += 96
          else:
              parts.append(f'<text x="50" y="290" fill="{muted}" font-family="Arial,sans-serif" font-size="16">No quote history found for this month.</text>')

          parts.append(f'<text x="42" y="585" fill="{white}" font-family="Arial,sans-serif" font-size="22" font-weight="700">Top 5 GitHub Actions delays</text>')
          parts.append(f'<text x="42" y="610" fill="{muted}" font-family="Arial,sans-serif" font-size="14">Largest recorded delays compared with the scheduled 06:00 UTC run</text>')

          if top_delays:
              y = 635
              for i, (date, delay) in enumerate(top_delays, 1):
                  date_label = date.strftime("%d/%m/%Y %H:%M")
                  parts.append(f'<rect x="42" y="{y}" width="916" height="34" rx="8" fill="{panel}" stroke="{border}"/>')
                  parts.append(f'<text x="60" y="{y+22}" fill="{white}" font-family="Arial,sans-serif" font-size="14">{i}.</text>')
                  parts.append(f'<text x="95" y="{y+22}" fill="{white}" font-family="Arial,sans-serif" font-size="14">{escape(date_label)}</text>')
                  parts.append(f'<text x="930" y="{y+22}" text-anchor="end" fill="{accents[0]}" font-family="Arial,sans-serif" font-size="14" font-weight="700">{delay} min</text>')
                  y += 39
          else:
              parts.append(f'<text x="50" y="660" fill="{muted}" font-family="Arial,sans-serif" font-size="16">No delay records found for this month yet.</text>')

          parts.append(f'<text x="42" y="{H-22}" fill="{muted}" font-family="Arial,sans-serif" font-size="12">Generated automatically by GitHub Actions · Archived monthly in img/monthly/</text>')
          parts.append("</svg>")

          output = Path(f"img/monthly/{month_key}.svg")
          output.write_text("\n".join(parts), encoding="utf-8")
          print(f"Monthly report generated: {output}")
          PY
          
      - name: Commit & Push
        run: |
          git config user.name "angeBiancamaria"
          git config user.email "129753970+angeBiancamaria@users.noreply.github.com"

          git add README.md
          git add stats/quotes_history.txt stats/quotes_stats.txt
          git add stats/delay_log.txt stats/top_quotes.txt
          git add img/top_quotes.svg

          # Ajouter les archives mensuelles uniquement si elles existent
          if [ -d "img/monthly" ]; then
            git add img/monthly/
          fi
      
          # Créer un commit uniquement si des fichiers ont changé
          if ! git diff --cached --quiet; then
            git commit -m "chore: update quote and monthly report"
            git push
          else
            echo "Aucune modification à enregistrer."
          fi
