name: Seasonal profile theme
on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      preview_theme:
        description: "Optional theme to preview (temporary until next scheduled run)"
        required: false
        type: choice
        options: [auto, winter, spring, summer, autumn, halloween, christmas, easter, birthday]
        default: auto
permissions:
  contents: write
concurrency:
  group: profile-main-branch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme to existing graphics
        env:
          PREVIEW: ${{ inputs.preview_theme || 'auto' }}
        run: |
          if [ "$PREVIEW" = "auto" ]; then python3 scripts/seasonal.py; else python3 scripts/seasonal.py --theme "$PREVIEW"; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md img/seasonal/corsica_current.svg img/seasonal/goals_current.svg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: apply seasonal profile skin"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
